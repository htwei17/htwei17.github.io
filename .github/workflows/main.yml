name: Build and Deploy Jekyll
on:
  push:
    branches:
      - main  # This is the source branch
  workflow_dispatch:
  schedule:
    # Publish the dated honor after Nov 6, 2026 (05:17 UTC = 00:17 New York).
    # Retry on the following two days; this annual schedule can be removed after release.
    - cron: '17 5 7-9 11 *'

jobs:
  jekyll:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4  # Updated to the latest version
      with:
        fetch-depth: 0  # Fetch all history for all branches and tags

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.4  # Keep in sync with local development

    - name: Install Dependencies
      run: bundle install

    - name: Build Jekyll Site
      run: bundle exec jekyll build  # This will build the site and output it to ./_site

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}  # Use your personal access token
        publish_dir: ./_site  # This is the folder that your site has been built to
        publish_branch: master  # This is the branch you want to deploy to
